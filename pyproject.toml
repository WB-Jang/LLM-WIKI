[tool.poetry]
name = "llm-wiki"
version = "0.2.0"
description = "LLM-maintained knowledge wiki"
authors = ["User <eeariorie2@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
nicegui = "^2.0"
openai = "^1.0"
pdfplumber = "^0.11"
pyyaml = "^6.0"
python-dotenv = "^1.0"
networkx = "^3.0"

[tool.poetry.scripts]
ingest = "scripts.ingest:main"
query = "scripts.query:main"
lint = "scripts.lint:main"
graphify = "scripts.graphify:main"
compare-graphs = "scripts.compare_graphs:main"
wiki = "app.web:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
